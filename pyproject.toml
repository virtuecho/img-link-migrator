[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "img-link-migrator"
version = "0.6.2"
description = "GUI, CLI, and standalone tools for migrating external image links"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "virtuecho" }
]
dependencies = []

[project.scripts]
img-link-migrator = "img_link_migrator:main"

[tool.setuptools]
py-modules = ["img_link_migrator"]
