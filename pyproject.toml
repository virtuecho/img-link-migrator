[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "img-link-migrator"
version = "1.1.1"
description = "Native macOS app for migrating and optimizing external image links"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "virtuecho" }
]
dependencies = ["pyvips[binary]==3.2.0", "Pillow==12.3.0", "pi-heif==1.4.0"]

[tool.setuptools]
py-modules = ["img_link_migrator", "image_processing"]
